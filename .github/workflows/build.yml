name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          # Without pipefail the pipe would hide a failed compile behind tee's exit code.
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build-output.txt

      # Run logs and artifacts both need a token to read, so a failed compile publishes its own
      # errors to a prerelease, which is readable without one.
      - name: Publish compile errors
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -E "^e: |^w: |FAILURE|error:" build-output.txt | head -60 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -60 build-output.txt > errors.txt; fi
          gh release delete ci-errors --yes --cleanup-tag || true
          gh release create ci-errors --title "Last failed build" --notes-file errors.txt --prerelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest build" \
            --notes "Automatically built from the latest commit on main." \
            --latest
          # A green build clears the errors left by the last red one.
          gh release delete ci-errors --yes --cleanup-tag || true
